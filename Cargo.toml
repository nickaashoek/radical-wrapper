[package]
name = "test-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = "0.13.0"
tokio = { version = "1", features = ["macros"] }
wasmtime = "25.0.1"
aws-config = { version= "1.5.10", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.54.0"
serde_json = "1.0.132"
serde = {version = "1.0.215", features = ["derive"]}
thiserror = "2.0.3"
# Need the below line for local testing
# reqwest = { version = "0.12.9", features = ["json", "rustls-tls"] }
# Need the below line for deployment
reqwest = { version = "0.12.9", default-features =  false, features = ["json", "rustls-tls"] }
uuid = { version = "1.11.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
aws-types = "1.3.3"
base64 = "0.22.1"

[package.metadata.lambda.env]
CHECK_URL = "http://localhost:8000"
REMOTE_URL = "https://r3e4tdhdvlpbsjcwvxnqe4f7ia0dyyjd.lambda-url.eu-west-3.on.aws/"
DEPLOYMENT = "edge"

[package.metadata.lambda.deploy]
memory = 1024                    # Function's memory
timeout = 600                    # Function's execution timeout
include = [ "function.serialized" ]       # Extra list of files to add to the zip bundle